<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTF-8 Painter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        input[type="file"] {
            padding: 0.5rem;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 5rem;
            padding: 0.3rem;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 4px;
        }

        select {
            padding: 0.3rem;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 4px;
        }

        button {
            padding: 0.3rem 1rem;
            background: #0f3460;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #output {
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 12px;
            line-height: normal;
            letter-spacing: 0px;
            white-space: pre;
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow: visible;
            max-width: 100%;
        }

        #status {
            margin: 0.5rem 0;
            font-style: italic;
            color: #888;
        }

        canvas {
            display: none;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>

<body>
    <h1>UTF-8 Painter</h1>
    <div class="controls">
        <input type="file" id="fileInput" accept="image/*">
        <label>Width: <input type="number" id="widthInput" value="76" min="10" max="400"></label>
        <label>Distance: <select id="distanceSelect"></select></label>
        <label>Evaluate: <select id="evaluateSelect"></select></label>
        <button id="runBtn" disabled>Run</button>
    </div>
    <div id="status">Select an image to begin.</div>
    <pre id="output"></pre>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module">
        import {
            estimateAscii,
            browserCanvasFactory,
            DISTANCE_FNS,
            EVALUTATE_FNS,
            WebGPURenderer,
        } from "./dist/utf8-painter.esm.js";

        const fileInput = document.getElementById("fileInput");
        const widthInput = document.getElementById("widthInput");
        const distanceSelect = document.getElementById("distanceSelect");
        const evaluateSelect = document.getElementById("evaluateSelect");
        const runBtn = document.getElementById("runBtn");
        const output = document.getElementById("output");
        const status = document.getElementById("status");
        const hiddenCanvas = document.getElementById("hiddenCanvas");

        let currentImageData = null;
        let gpuRenderer = null;

        // Try to initialize WebGPU
        WebGPURenderer.create()
            .then((r) => {
                gpuRenderer = r;
                console.log("WebGPU renderer initialized");
            })
            .catch((err) => {
                console.warn("WebGPU not available, using CPU fallback:", err.message);
            });

        for (const key of Object.keys(DISTANCE_FNS)) {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = key;
            distanceSelect.appendChild(opt);
        }

        for (const key of Object.keys(EVALUTATE_FNS)) {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = key;
            evaluateSelect.appendChild(opt);
        }

        async function runGPU(width, distance_fn, evaluate_fn) {
            const t0 = performance.now();
            for await (const ascii of gpuRenderer.estimateAscii(
                currentImageData,
                width,
                browserCanvasFactory,
                evaluate_fn,
                distance_fn,
            )) {
                output.textContent = ascii;
                status.textContent = `WebGPU — searching...`;
            }
            const ms = (performance.now() - t0).toFixed(0);
            status.textContent = `Done (WebGPU) — ${width} columns in ${ms}ms`;
        }

        async function runCPU(width, distance_fn, evaluate_fn) {
            const t0 = performance.now();
            for (const ascii of estimateAscii(
                currentImageData,
                width,
                browserCanvasFactory,
                evaluate_fn,
                distance_fn,
            )) {
                output.textContent = ascii;
                status.textContent = `CPU — searching...`;
                await new Promise(x => requestAnimationFrame(x));
            }
            const ms = (performance.now() - t0).toFixed(0);
            status.textContent = `Done (CPU) — ${width} columns in ${ms}ms`;
        }

        async function run() {
            if (!currentImageData) return;

            const width = parseInt(widthInput.value, 10) || 76;
            status.textContent = "Converting...";
            output.textContent = "";

            await new Promise((r) => setTimeout(r, 50));
            await document.fonts.ready;

            const distance_fn = distanceSelect.value;
            const evaluate_fn = evaluateSelect.value;

            try {
                if (gpuRenderer) {
                    await runGPU(width, distance_fn, evaluate_fn);
                } else {
                    await runCPU(width, distance_fn, evaluate_fn);
                }
            } catch (err) {
                status.textContent = `Error: ${err.message}`;
                console.error(err);
            }
        }

        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.textContent = "Loading image...";
            output.textContent = "";

            const img = new Image();
            img.onload = () => {
                hiddenCanvas.width = img.width;
                hiddenCanvas.height = img.height;
                const ctx = hiddenCanvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                currentImageData = ctx.getImageData(
                    0, 0, img.width, img.height
                );
                runBtn.disabled = false;
                status.textContent = `Image loaded. Press Run to convert.${gpuRenderer ? " (WebGPU)" : " (CPU)"}`;
            };

            img.onerror = () => {
                status.textContent = "Failed to load image.";
            };

            img.src = URL.createObjectURL(file);
        });

        runBtn.addEventListener("click", run);
    </script>
</body>

</html>
