<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTF-8 Painter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>
    <aside class="sidebar">
        <h1>UTF-8 Painter</h1>
        <div class="layer-panel">
            <div class="layer-panel-header">
                <span>Layers</span>
                <div class="layer-panel-actions">
                    <button id="addLayerBtn" type="button" title="Add Layer">+</button>
                    <button id="removeLayerBtn" type="button" title="Remove Layer">&minus;</button>
                </div>
            </div>
            <div id="layerList" class="layer-list"></div>
        </div>
        <div class="controls">
            <input type="file" id="fileInput" accept="image/*">
            <div class="controls-row">
                <div class="slider-group">
                    <label>Width:</label>
                    <input type="range" id="widthRange" value="76" min="20" max="400" step="1">
                    <input type="number" id="widthInput" value="76" min="20" max="400" step="1">
                </div>
            </div>
            <div class="controls-row">
                <label>Font: <input type="text" id="fontInput" value="monospace" style="width:12rem;padding:0.3rem;background:#1a1a2e;border:1px solid #0f3460;color:#eee;border-radius:4px"></label>
            </div>
            <div class="controls-row">
                <label>Line Height: <input type="text" id="lineHeightInput" value="normal" style="width:5rem;padding:0.3rem;background:#1a1a2e;border:1px solid #0f3460;color:#eee;border-radius:4px"></label>
            </div>
            <div class="controls-row">
                <label>Distance: <select id="distanceSelect"></select></label>
            </div>
            <div class="controls-row">
                <label>Evaluate: <select id="evaluateSelect"></select></label>
            </div>
            <div class="controls-row">
                <div class="slider-group">
                    <label>Brightness:</label>
                    <input type="range" id="brightnessRange" value="0" min="-1" max="1" step="0.05">
                    <input type="number" id="brightnessInput" value="0" min="-1" max="1" step="0.05">
                </div>
            </div>
            <div class="controls-row">
                <div class="slider-group">
                    <label>Contrast:</label>
                    <input type="range" id="contrastRange" value="1" min="0" max="30" step="0.25">
                    <input type="number" id="contrastInput" value="1" min="0" max="30" step="0.25">
                </div>
                <button id="autoBtn" type="button" style="width:auto">Auto</button>
                <button id="resetBCBtn" type="button" style="width:auto">Reset</button>
            </div>
            <div class="controls-row">
                <label>Crop:</label>
                <button id="cropBtn" type="button" style="width:auto">Select Region</button>
                <button id="clearCropBtn" type="button" style="width:auto" disabled>Clear</button>
                <span class="crop-hint">Drag: set &middot; Shift: union &middot; Alt/&#8984;: remove</span>
            </div>
            <div class="controls-row">
                <label><input type="checkbox" id="invertGlyphsCheck"> Invert Glyphs</label>
                <label><input type="checkbox" id="invertImageCheck"> Invert Image</label>
            </div>
        </div>
        <div class="charset-panel">
            <div class="controls-row">
                <label>Characters:</label>
                <label><input type="radio" name="charSource" id="charSourceBlocks" value="blocks" checked> Unicode blocks</label>
                <label><input type="radio" name="charSource" id="charSourceCustom" value="custom"> Custom</label>
                <span id="charCount" class="char-count"></span>
            </div>
            <label class="char-field" id="includeField">Include
                <textarea id="includeInput" class="char-input" rows="2" placeholder="e.g. .:-=+*#%@" spellcheck="false"></textarea>
            </label>
            <label class="char-field">Exclude
                <textarea id="excludeInput" class="char-input" rows="1" placeholder="Removed from the palette above" spellcheck="false"></textarea>
            </label>
        </div>
        <div class="block-selector" id="blockSelector">
            <div class="controls-row" style="margin-bottom:0.5rem">
                <button id="deselectAllBtn" type="button" style="width:auto;flex:1">Deselect All</button>
                <button id="defaultsBtn" type="button" style="width:auto;flex:1">Defaults</button>
            </div>
            <div class="block-columns">
                <div class="block-column">
                    <div class="block-column-header">Selected</div>
                    <div class="block-list" id="selectedBlocks"></div>
                </div>
                <div class="block-column">
                    <div class="block-column-header">Available</div>
                    <div class="block-list" id="availableBlocks"></div>
                </div>
            </div>
        </div>
    </aside>
    <main class="main">
        <div id="status">Select an image to begin.</div>
        <canvas id="preview"></canvas>
        <div id="stats"></div>
        <div class="output-wrap">
            <pre id="output"></pre>
            <div id="cropOverlay" class="crop-overlay"></div>
        </div>
    </main>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module" src="app.js"></script>
</body>

</html>
